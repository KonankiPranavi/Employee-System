apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-v2
  template:
    metadata:
      labels:
        app: employee-v2
    spec:
      containers:
      - name: employee-system-v2
        image: konankipranavi/employee-system:v2
        ports:
        - containerPort: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: employee-v2-service
spec:
  type: NodePort
  selector:
    app: employee-v2
  ports:
    - port: 5002
      targetPort: 5002
      nodePort: 30002
